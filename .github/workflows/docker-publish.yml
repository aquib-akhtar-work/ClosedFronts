name: 🐳 Build & Push Docker Image

# Builds the multi-stage Dockerfile and pushes the resulting image to the
# GitHub Container Registry (ghcr.io) as `closedfronts`, so it can be pulled
# and run on the VPS. This is independent of the upstream `deploy.yml`
# (which SSH-deploys to openfront.io's own hosts and is gated to that repo).
#
# Auth uses the automatically-provided GITHUB_TOKEN — no registry secrets to
# create. The first publish creates a GHCR package named `closedfronts` under
# the repo owner's namespace; set it to Public in your GitHub package settings
# if you want anonymous `docker pull` on the VPS (otherwise pull with a PAT).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lowercase owner (GHCR requires lowercase)
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/closedfronts
          tags: |
            # `latest` only on the default branch (main)
            type=raw,value=latest,enable={{is_default_branch}}
            # short commit sha, e.g. sha-ad9df40
            type=sha,format=short,prefix=sha-
            # branch name, e.g. main
            type=ref,event=branch
            # semver on tags: v1.2.3 -> 1.2.3, 1.2, 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
