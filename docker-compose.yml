# Sample compose file for running the closedfronts image on a VPS.
#
# Usage:
#   1) Copy `.env.example` to `.env` and fill in DOMAIN etc.
#   2) docker compose pull && docker compose up -d
#   3) Put a TLS reverse proxy (Caddy/nginx) in front of host port 8080.
#
# The image runs nginx (container port 80) in front of one or more Node game
# workers (3001+), managed by supervisord. NUM_WORKERS is read at container
# start and configures the nginx upstream automatically.

services:
  closedfronts:
    image: ghcr.io/${GHCR_OWNER:-aquib-akhtar-work}/closedfronts:${TAG:-latest}
    container_name: closedfronts
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:80"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      SUBDOMAIN: ${SUBDOMAIN:-main}
      NUM_WORKERS: ${NUM_WORKERS:-1}
      CDN_BASE: ${CDN_BASE:-}
      # Optional — only if you run the closed-source auth/Cloudflare Worker:
      # API_KEY: ${API_KEY:-}
    # If you created a .env next to this file, uncomment to load it:
    # env_file: .env
